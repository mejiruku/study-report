<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon-180x180.png" />
    <title>StudyReport</title>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="error-log" style="color: red; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: white; padding: 10px; display: none; max-height: 50vh; overflow-y: auto; border-bottom: 2px solid red;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin: 0;">システムエラーが発生しました</h3>
        <button onclick="window.location.reload()" style="padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">再読み込み</button>
      </div>
      <div id="error-text" style="font-family: monospace; font-size: 12px; white-space: pre-wrap;"></div>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        var el = document.getElementById('error-log');
        var textEl = document.getElementById('error-text');
        el.style.display = 'block';
        textEl.innerText += event.message + '\n';
      });
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('error-log');
        var textEl = document.getElementById('error-text');
        el.style.display = 'block';
        textEl.innerText += (event.reason ? event.reason.toString() : 'Unhandled Rejection') + '\n';
      });
    </script>
    <div id="root"></div>
    <div id="startup-skeleton" role="status" aria-label="StudyReportを読み込み中">
      <div aria-hidden="true">
        <div class="header-container">
          <div class="header-title-box">
            <h2>StudyReport</h2>
            <span class="skeleton-pulse skeleton-sync"></span>
          </div>
          <span class="settings-btn"><span class="skeleton-pulse skeleton-glyph"></span></span>
        </div>
        <div class="tab-navigation">
          <span class="tab-btn"><span class="skeleton-pulse skeleton-label"></span></span>
          <span class="tab-btn"><span class="skeleton-pulse skeleton-label"></span></span>
          <span class="tab-btn"><span class="skeleton-pulse skeleton-label"></span></span>
          <span class="tab-btn"><span class="skeleton-pulse skeleton-label"></span></span>
        </div>
        <div class="daily-goal-bar-container startup-goal">
          <div class="daily-goal-bar-empty">
            <span class="daily-goal-bar-empty-icon skeleton-pulse skeleton-glyph"></span>
            <span class="skeleton-pulse skeleton-goal-label"></span>
          </div>
        </div>
        <div class="section-header-row">
          <h3 class="section-title" style="border-bottom: none; margin-bottom: 0">学習を記録</h3>
          <span class="icon-add-btn skeleton-add">＋ 教材追加</span>
        </div>
        <div class="materials-section">
          <div class="category-group">
            <div class="category-title"><span class="skeleton-pulse skeleton-category"></span></div>
            <div class="materials-grid">
              <div class="material-card-placeholder"><span class="material-thumb skeleton-pulse"></span><span class="skeleton-pulse skeleton-book-label"></span></div>
              <div class="material-card-placeholder"><span class="material-thumb skeleton-pulse"></span><span class="skeleton-pulse skeleton-book-label"></span></div>
              <div class="material-card-placeholder"><span class="material-thumb skeleton-pulse"></span><span class="skeleton-pulse skeleton-book-label"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
